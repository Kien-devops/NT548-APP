name: nt548

x-backend-environment: &backend-environment
  NODE_ENV: ${NODE_ENV:-production}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-nt548}
  DB_USER: ${DB_USER:-nt548_app}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_SSL: ${DB_SSL:-false}
  DB_SSL_CA: ${DB_SSL_CA:-}
  DB_CHARSET: ${DB_CHARSET:-utf8mb4}
  DB_TIMEZONE: ${DB_TIMEZONE:-Z}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nt548
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nt548"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
  db-init:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nt548
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nt548.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    logging: *default-logging

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-nt548}
      MYSQL_USER: ${DB_USER:-nt548_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${DB_TIMEZONE:-Z}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - private
    logging: *default-logging

  be-user-service:
    build:
      context: ./be-user-service
      dockerfile: Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    init: true
    environment:
      <<: *backend-environment
      PORT: "5001"
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-3600}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nt548
      DB_USER: nt548_user
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
    expose:
      - "5001"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - private
    logging: *default-logging

  be-product-service:
    build:
      context: ./be-product-service
      dockerfile: Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    init: true
    environment:
      <<: *backend-environment
      PORT: "5002"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nt548
      DB_USER: nt548_product
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env}
    expose:
      - "5002"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - private
    logging: *default-logging

  be-order-service:
    build:
      context: ./be-order-service
      dockerfile: Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    init: true
    environment:
      <<: *backend-environment
      PORT: "5003"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nt548
      DB_USER: nt548_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    expose:
      - "5003"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - private
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      DNS_RESOLVER: 127.0.0.11
      USER_SERVICE_HOST: be-user-service
      USER_SERVICE_PORT: "5001"
      PRODUCT_SERVICE_HOST: be-product-service
      PRODUCT_SERVICE_PORT: "5002"
      ORDER_SERVICE_HOST: be-order-service
      ORDER_SERVICE_PORT: "5003"
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      be-user-service:
        condition: service_healthy
      be-product-service:
        condition: service_healthy
      be-order-service:
        condition: service_healthy
    networks:
      - edge
      - private
    logging: *default-logging

volumes:
  mysql_data:
    name: nt548_mysql_data
  postgres_data:

networks:
  edge:
    name: nt548_edge
  private:
    name: nt548_private
    internal: true
