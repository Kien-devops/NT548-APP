version: 0.2

env:
  variables:
    AWS_REGION: "ap-southeast-1"
    ENVIRONMENT: "prod"
  exported-variables:
    - IMAGE_TAG
    - SCAN_SUMMARY

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - "chmod +x scripts/*.sh"
  pre_build:
    commands:
      - "echo Phase 1 Change Detection"
      - "bash scripts/detect-changes.sh"
      - ". ./changed_components.env"
      - "export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - "COMMIT_HASH=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse --short HEAD 2>/dev/null || echo '')} | cut -c 1-7)"
      - "test -n \"$COMMIT_HASH\" || { echo 'Missing source commit SHA; refusing a non-immutable image tag'; exit 1; }"
      - "IMAGE_TAG=$COMMIT_HASH"
      - "echo Target PROD Image Tag: $IMAGE_TAG"
      - "echo Phase 2 Testing Changed Services"
      - "if [ \"$USER_CHANGED\" = \"true\" ]; then npm ci --prefix be-user-service --omit=dev && bash scripts/test-service.sh user; else echo '[SKIP] user-service unchanged'; fi"
      - "if [ \"$PRODUCT_CHANGED\" = \"true\" ]; then pip install -r be-product-service/requirements.txt && bash scripts/test-service.sh product; else echo '[SKIP] product-service unchanged'; fi"
      - "if [ \"$ORDER_CHANGED\" = \"true\" ]; then npm ci --prefix be-order-service --omit=dev && bash scripts/test-service.sh order; else echo '[SKIP] order-service unchanged'; fi"
      - "if [ \"$FRONTEND_CHANGED\" = \"true\" ]; then bash scripts/test-service.sh frontend; else echo '[SKIP] frontend unchanged'; fi"
      - "if [ \"$DATABASE_CHANGED\" = \"true\" ]; then bash scripts/test-service.sh database; else echo '[SKIP] database unchanged'; fi"
  build:
    commands:
      - "echo Phase 3 Building Changed Docker Images"
      - "if [ \"$USER_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh user $IMAGE_TAG prod; else echo '[SKIP] user-service unchanged'; fi"
      - "if [ \"$PRODUCT_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh product $IMAGE_TAG prod; else echo '[SKIP] product-service unchanged'; fi"
      - "if [ \"$ORDER_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh order $IMAGE_TAG prod; else echo '[SKIP] order-service unchanged'; fi"
      - "if [ \"$FRONTEND_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh frontend $IMAGE_TAG prod; else echo '[SKIP] frontend unchanged'; fi"
      - "echo Phase 4 Pushing Changed Images to PROD ECR"
      - "if [ \"$USER_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh user $IMAGE_TAG prod; fi"
      - "if [ \"$PRODUCT_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh product $IMAGE_TAG prod; fi"
      - "if [ \"$ORDER_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh order $IMAGE_TAG prod; fi"
      - "if [ \"$FRONTEND_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh frontend $IMAGE_TAG prod; fi"
  post_build:
    commands:
      - "echo Phase 5 Verifying ECR Scans for Changed Images"
      - "rm -f ecr-scan-summary.json"
      - "if [ \"$USER_CHANGED\" = \"true\" ]; then bash scripts/check-service-scan.sh user $IMAGE_TAG prod; fi"
      - "if [ \"$PRODUCT_CHANGED\" = \"true\" ]; then bash scripts/check-service-scan.sh product $IMAGE_TAG prod; fi"
      - "if [ \"$ORDER_CHANGED\" = \"true\" ]; then bash scripts/check-service-scan.sh order $IMAGE_TAG prod; fi"
      - "if [ \"$FRONTEND_CHANGED\" = \"true\" ]; then bash scripts/check-service-scan.sh frontend $IMAGE_TAG prod; fi"
      - "if [ ! -f ecr-scan-summary.json ]; then echo '[]' > ecr-scan-summary.json; fi"
      - >-
        export SCAN_SUMMARY=$(python3 -c 'import json; data=json.load(open("ecr-scan-summary.json")); print("; ".join("{repository}@{digest}:C={critical},H={high}".format(**item) for item in data) if data else "No images built; all services unchanged")')
      - "echo Scan Summary: $SCAN_SUMMARY"
      - "echo Phase 6 Generating ECS Image Definitions (Changed vs Unchanged)"
      - "bash scripts/generate-imagedefinitions.sh $AWS_ACCOUNT_ID $AWS_REGION $IMAGE_TAG changed_components.env"
      - "echo PROD application build, scan, and artifact generation complete"

artifacts:
  files:
    - imagedefinitions-frontend.json
    - imagedefinitions-user.json
    - imagedefinitions-product.json
    - imagedefinitions-order.json
    - ecr-scan-summary.json
    - changed_components.json
    - changed_components.env
