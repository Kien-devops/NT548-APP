version: 0.2

env:
  variables:
    AWS_REGION: "ap-southeast-1"
    ENVIRONMENT: "dev"

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - "chmod +x scripts/*.sh"
  pre_build:
    commands:
      - "echo Phase 1 Change Detection"
      - "bash scripts/detect-changes.sh"
      - ". ./changed_components.env"
      - "export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - "COMMIT_HASH=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse --short HEAD 2>/dev/null || echo '')} | cut -c 1-7)"
      - "test -n \"$COMMIT_HASH\" || { echo 'Missing source commit SHA; refusing a non-immutable image tag'; exit 1; }"
      - "IMAGE_TAG=$COMMIT_HASH"
      - "echo Target Image Tag: $IMAGE_TAG"
      - "echo Phase 2 Testing Changed Services"
      - "if [ \"$USER_CHANGED\" = \"true\" ]; then npm ci --prefix be-user-service --omit=dev && bash scripts/test-service.sh user; else echo '[SKIP] user-service unchanged'; fi"
      - "if [ \"$PRODUCT_CHANGED\" = \"true\" ]; then pip install -r be-product-service/requirements.txt && bash scripts/test-service.sh product; else echo '[SKIP] product-service unchanged'; fi"
      - "if [ \"$ORDER_CHANGED\" = \"true\" ]; then npm ci --prefix be-order-service --omit=dev && bash scripts/test-service.sh order; else echo '[SKIP] order-service unchanged'; fi"
      - "if [ \"$FRONTEND_CHANGED\" = \"true\" ]; then bash scripts/test-service.sh frontend; else echo '[SKIP] frontend unchanged'; fi"
      - "if [ \"$DATABASE_CHANGED\" = \"true\" ]; then bash scripts/test-service.sh database; else echo '[SKIP] database unchanged'; fi"
  build:
    commands:
      - "echo Phase 3 Building Changed Docker Images"
      - "if [ \"$USER_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh user $IMAGE_TAG dev; else echo '[SKIP] user-service unchanged'; fi"
      - "if [ \"$PRODUCT_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh product $IMAGE_TAG dev; else echo '[SKIP] product-service unchanged'; fi"
      - "if [ \"$ORDER_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh order $IMAGE_TAG dev; else echo '[SKIP] order-service unchanged'; fi"
      - "if [ \"$FRONTEND_CHANGED\" = \"true\" ]; then bash scripts/build-service.sh frontend $IMAGE_TAG dev; else echo '[SKIP] frontend unchanged'; fi"
  post_build:
    commands:
      - "echo Phase 4 Pushing Changed Images to DEV ECR"
      - "if [ \"$USER_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh user $IMAGE_TAG dev; fi"
      - "if [ \"$PRODUCT_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh product $IMAGE_TAG dev; fi"
      - "if [ \"$ORDER_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh order $IMAGE_TAG dev; fi"
      - "if [ \"$FRONTEND_CHANGED\" = \"true\" ]; then bash scripts/push-image.sh frontend $IMAGE_TAG dev; fi"
      - "echo Phase 5 Generating Build Metadata"
      - "python3 -c '
import json, os
metadata = {
    \"commitHash\": os.environ.get(\"COMMIT_HASH\", \"\"),
    \"imageTag\": os.environ.get(\"IMAGE_TAG\", \"\"),
    \"environment\": \"dev\",
    \"components\": {
        \"frontend\": os.environ.get(\"FRONTEND_CHANGED\", \"false\") == \"true\",
        \"user\": os.environ.get(\"USER_CHANGED\", \"false\") == \"true\",
        \"product\": os.environ.get(\"PRODUCT_CHANGED\", \"false\") == \"true\",
        \"order\": os.environ.get(\"ORDER_CHANGED\", \"false\") == \"true\",
        \"database\": os.environ.get(\"DATABASE_CHANGED\", \"false\") == \"true\"
    }
}
with open(\"build_metadata.json\", \"w\") as f:
    json.dump(metadata, f, indent=2)
' "
      - "cat build_metadata.json"
      - "echo DEV build and push completed successfully"

artifacts:
  files:
    - build_metadata.json
    - changed_components.json
    - changed_components.env
    - scripts/**/*
    - buildspec/**/*
